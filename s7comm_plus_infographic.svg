  <!-- CARD 3: Terminal -->
  <g transform="translate(988,195)">
    <rect width="390" height="545" rx="16" fill="url(#cardBg)" stroke="#1a7a50" stroke-width="2"/>
    <rect x="25" y="28" width="340" height="382" rx="10" fill="url(#termBg)" stroke="#1a3a60" stroke-width="1.5"/>
    <rect x="25" y="28" width="340" height="38" rx="10" fill="#161f38"/>
    <rect x="25" y="52" width="340" height="14" fill="#161f38"/>
    <circle cx="52" cy="47" r="8" fill="#ff5f57"/>
    <circle cx="77" cy="47" r="8" fill="#febc2e"/>
    <circle cx="102" cy="47" r="8" fill="#28c840"/>
    <text x="195" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#6a9fd0">s7comm-plus — bash</text>
    <text x="44" y="96" font-family="Courier New, monospace" font-size="14" fill="#4eff91">$ dotnet s7comm connect</text>
    <text x="44" y="120" font-family="Courier New, monospace" font-size="13" fill="#6aaad0">  Host: 192.168.1.100</text>
    <text x="44" y="144" font-family="Courier New, monospace" font-size="13" fill="#6aaad0">  Port: 102  (TLS)</text>
    <text x="44" y="168" font-family="Courier New, monospace" font-size="14" fill="#4eff91">&#10003; TLS handshake OK</text>
    <text x="44" y="192" font-family="Courier New, monospace" font-size="14" fill="#4eff91">&#10003; Auth success</text>
    <text x="44" y="218" font-family="Courier New, monospace" font-size="13" fill="#6aaad0">$ read-tag "Motor.Speed"</text>
    <text x="44" y="244" font-family="Courier New, monospace" font-size="14" fill="#ffd700">  &#9658; 1450.0 RPM</text>
    <text x="44" y="270" font-family="Courier New, monospace" font-size="13" fill="#6aaad0">$ write-tag "Pump.On" true</text>
    <text x="44" y="296" font-family="Courier New, monospace" font-size="14" fill="#4eff91">&#10003; Tag written OK</text>
    <text x="44" y="322" font-family="Courier New, monospace" font-size="13" fill="#6aaad0">$ monitor --interval 500</text>
    <text x="44" y="348" font-family="Courier New, monospace" font-size="14" fill="#4eff91">  Streaming data...</text>
    <rect x="44" y="362" width="10" height="16" rx="1" fill="#4eff91"/>
    <text x="195" y="460" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" fill="#ffffff">Terminal</text>
    <text x="195" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#3ecf90">Secure CLI Access</text>
  </g>

